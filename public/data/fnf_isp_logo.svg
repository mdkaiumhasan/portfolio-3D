<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="36" fill="url(#bgGrad)" stroke="#06b6d4" stroke-width="3" stroke-opacity="0.4" />
  
  <!-- Subtle Glow Behind Icon -->
  <circle cx="100" cy="85" r="55" fill="url(#glowGrad)" />

  <!-- ISP / Tower Waves -->
  <path d="M 45 80 A 70 70 0 0 1 155 80" fill="none" stroke="url(#cyanGrad)" stroke-width="6" stroke-linecap="round" stroke-opacity="0.5" />
  <path d="M 60 95 A 50 50 0 0 1 140 95" fill="none" stroke="url(#cyanGrad)" stroke-width="6.5" stroke-linecap="round" stroke-opacity="0.75" />
  <path d="M 75 110 A 30 30 0 0 1 125 110" fill="none" stroke="url(#cyanGrad)" stroke-width="7" stroke-linecap="round" />
  <circle cx="100" cy="122" r="7.5" fill="#00e5ff" />

  <!-- Center Network Node / Core -->
  <circle cx="100" cy="65" r="6" fill="#38bdf8" />
  <line x1="100" y1="71" x2="100" y2="114" stroke="#38bdf8" stroke-width="3" stroke-dasharray="3,3" />

  <!-- Typography: FNF ONLINE ISP -->
  <text x="100" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">FNF ONLINE</text>
  <text x="100" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#00e5ff" text-anchor="middle" letter-spacing="2.5">ISP NETWORK</text>
</svg>
