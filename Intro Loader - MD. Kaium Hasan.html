<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Intro Loader - MD. Kaium Hasan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--ink:#0c1330;--deep:#070b1c;--mesh:#4a5ca8;--signal:#7cf3ff;--text:#eaf0ff;--dim:#8e9bc9;
  --display:'Syne','Trebuchet MS',sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--deep);color:var(--text);font-family:var(--display)}
body.lock{overflow:hidden}

/* ---------- site underneath (replace with your 3D portfolio) ---------- */
#site{min-height:100%;display:grid;place-items:center;text-align:center;padding:24px}
#site h1{font-size:clamp(28px,6vw,64px);margin:0 0 8px;font-weight:700;letter-spacing:-.02em}
#site p{color:var(--dim);font-family:var(--mono);margin:0 0 28px}
#replay{font:inherit;font-family:var(--mono);color:var(--signal);background:none;border:1px solid var(--mesh);
  padding:10px 18px;border-radius:999px;cursor:pointer}
#replay:hover{border-color:var(--signal)}
#replay:focus-visible{outline:2px solid var(--signal);outline-offset:3px}

/* ---------- loader ---------- */
#loader{position:fixed;inset:0;z-index:9999;overflow:hidden}
.panel{position:absolute;left:0;right:0;height:50.2%;background:var(--ink)}
.pt{top:0}.pb{bottom:0}
#seam{position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:var(--signal);
  box-shadow:0 0 18px var(--signal);transform:scaleX(0);opacity:0;z-index:3}
.stage{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
#mesh{position:absolute;inset:0;width:100%;height:100%;opacity:0}
#name{position:relative;margin:0;font-weight:700;font-size:clamp(34px,9vw,120px);letter-spacing:-.03em;line-height:1.05;text-align:center}
.ch{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em}
.ch i{display:inline-block;font-style:normal}
.sp{display:inline-block;width:.28em}
#role{position:relative;margin:14px 0 0;color:var(--dim);font-family:var(--mono);font-size:clamp(12px,1.6vw,16px);text-align:center}
#bar{position:relative;width:min(420px,70vw);height:2px;background:rgba(124,243,255,.15);margin-top:28px}
#fill{height:100%;background:var(--signal);transform-origin:left;transform:scaleX(0);box-shadow:0 0 10px var(--signal)}
.hud{position:absolute;left:max(20px,env(safe-area-inset-left,0px));right:max(20px,env(safe-area-inset-right,0px));
  bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
#count{font-weight:700;font-size:clamp(48px,10vw,120px);line-height:.85;font-variant-numeric:tabular-nums;letter-spacing:-.04em}
#count small{font-size:.28em;color:var(--signal);margin-left:.15em;letter-spacing:0}
#log{font-family:var(--mono);font-size:clamp(11px,1.3vw,13px);color:var(--dim);text-align:right;min-height:4.8em;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
#log div:last-child{color:var(--text)}
#log b{color:var(--signal);font-weight:400}
@media (max-width:560px){.hud{flex-direction:column;align-items:flex-start}#log{text-align:left}}
</style>
</head>
<body class="lock">

<main id="site">
  <div>
    <h1>Portfolio is live</h1>
    <p>your 3D scene renders here</p>
    <button id="replay" type="button">Replay intro</button>
  </div>
</main>

<div id="loader" role="status" aria-live="polite" aria-label="Loading portfolio">
  <div class="panel pt"></div>
  <div class="panel pb"></div>
  <div id="seam"></div>
  <div class="stage">
    <canvas id="mesh" aria-hidden="true"></canvas>
    <h1 id="name" aria-label="MD. Kaium Hasan"></h1>
    <p id="role">Network Engineer &amp; Software Developer</p>
    <div id="bar"><div id="fill"></div></div>
    <div class="hud">
      <div id="count">0<small>%</small></div>
      <div id="log"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function(){
  const $ = s => document.querySelector(s);
  const loader=$('#loader'), cv=$('#mesh'), cx=cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const NAME='MD. Kaium Hasan';
  const LOGS=[
    [0,'resolving host ... <b>ok</b>'],
    [25,'tcp handshake ... <b>established</b>'],
    [50,'streaming 3D assets ...'],
    [80,'compiling shaders ... <b>done</b>'],
    [100,'scene <b>ready</b>']
  ];

  /* ---- network mesh canvas ---- */
  let W,H,D,nodes=[],packets=[],prog=0,raf=0,live=false;
  function size(){
    D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
    cv.width=W*D;cv.height=H*D;cx.setTransform(D,0,0,D,0,0);
    const n=Math.round(Math.min(70,W*H/16000)),s=reduce?0:.18;
    nodes=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,
      vx:(Math.random()-.5)*s,vy:(Math.random()-.5)*s,r:1+Math.random()*1.6}));
    packets=[];
  }
  const near=(a,L,skip)=>nodes.filter(b=>b!==a&&b!==skip&&Math.hypot(a.x-b.x,a.y-b.y)<L);
  function frame(){
    if(!live)return;
    const L=Math.min(W,H)*.24+60;
    cx.clearRect(0,0,W,H);
    for(const n of nodes){n.x+=n.vx;n.y+=n.vy;
      if(n.x<0||n.x>W)n.vx*=-1;if(n.y<0||n.y>H)n.vy*=-1;}
    cx.lineWidth=1;
    for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
      const a=nodes[i],b=nodes[j],d=Math.hypot(a.x-b.x,a.y-b.y);
      if(d<L){cx.strokeStyle='rgba(74,92,168,'+((1-d/L)*.55)+')';
        cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke();}
    }
    cx.fillStyle='#4a5ca8';
    for(const n of nodes){cx.beginPath();cx.arc(n.x,n.y,n.r,0,6.283);cx.fill();}
    /* packets hop node to node, faster and denser as progress rises */
    if(!reduce&&packets.length<26&&Math.random()<.04+prog*.14){
      const a=nodes[(Math.random()*nodes.length)|0],nb=near(a,L);
      if(nb.length)packets.push({a,b:nb[(Math.random()*nb.length)|0],p:0,hops:0,sp:.02+Math.random()*.02+prog*.02});
    }
    packets=packets.filter(k=>{
      k.p+=k.sp;
      if(k.p>=1){
        const nb=near(k.b,L,k.a);
        if(++k.hops>4||!nb.length)return false;
        k.a=k.b;k.b=nb[(Math.random()*nb.length)|0];k.p=0;
      }
      const x=k.a.x+(k.b.x-k.a.x)*k.p,y=k.a.y+(k.b.y-k.a.y)*k.p;
      const g=cx.createRadialGradient(x,y,0,x,y,10);
      g.addColorStop(0,'rgba(124,243,255,.95)');g.addColorStop(1,'rgba(124,243,255,0)');
      cx.fillStyle=g;cx.beginPath();cx.arc(x,y,10,0,6.283);cx.fill();
      return true;
    });
    raf=requestAnimationFrame(frame);
  }

  /* ---- intro ---- */
  function start(){
    document.body.classList.add('lock');
    gsap.set(loader,{display:'block'});
    gsap.set('.stage',{opacity:1});
    gsap.set('.panel',{clearProps:'transform'});
    gsap.set('#seam',{scaleX:0,opacity:0});
    gsap.set('#fill',{scaleX:0});
    $('#count').innerHTML='0<small>%</small>';$('#log').innerHTML='';
    $('#name').innerHTML=[...NAME].map(c=>c===' '?'<span class="sp"></span>':'<span class="ch"><i>'+c+'</i></span>').join('');
    size();live=true;cancelAnimationFrame(raf);frame();

    /* set window.portfolioReady = a Promise that resolves when your 3D models finish loading */
    const ready=window.portfolioReady||Promise.resolve();
    const P={v:0};let shown=-1;
    const tl=gsap.timeline();
    tl.to(cv,{opacity:1,duration:.8},0)
      .from('.ch i',{yPercent:115,duration:.7,stagger:.04,ease:'power3.out'},.2)
      .from('#role',{opacity:0,y:8,duration:.6},.9)
      .to(P,{v:100,duration:3.6,ease:'power2.inOut',onUpdate(){
        prog=P.v/100;
        $('#count').innerHTML=Math.round(P.v)+'<small>%</small>';
        gsap.set('#fill',{scaleX:prog});
        LOGS.forEach(([at,msg],i)=>{
          if(P.v>=at&&i>shown){shown=i;
            const d=document.createElement('div');d.innerHTML='&gt; '+msg;$('#log').appendChild(d);
            while($('#log').children.length>4)$('#log').firstChild.remove();}
        });
      }},.3)
      .call(()=>{Promise.resolve(ready).then(exit)},null,4.0);
  }

  function exit(){
    const e=gsap.timeline({onComplete(){
      loader.style.display='none';live=false;cancelAnimationFrame(raf);
      document.body.classList.remove('lock');
    }});
    e.to('.stage',{opacity:0,duration:.3,ease:'power1.in'},0);
    if(reduce){e.to('.panel',{opacity:0,duration:.5},.2);return;}
    e.fromTo('#seam',{scaleX:0,opacity:1},{scaleX:1,duration:.25,ease:'power2.out'},.1)
     .to('#seam',{opacity:0,duration:.15},.55)
     .to('.pt',{yPercent:-100,duration:.55,ease:'power3.inOut'},.35)
     .to('.pb',{yPercent:100,duration:.55,ease:'power3.inOut'},.35);
  }

  addEventListener('resize',()=>{if(live)size();});
  $('#replay').addEventListener('click',()=>{gsap.set('.panel',{opacity:1});start();});
  start();
})();
</script>
</body>
</html>
